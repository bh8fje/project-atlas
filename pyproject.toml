[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-atlas"
version = "0.1.0"
description = "A local-first AI project knowledge map."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = []
dependencies = []

[project.scripts]
project-atlas-local = "project_atlas.local_service:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
